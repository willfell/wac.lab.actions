apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: travel-app
  namespace: travel
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: travel-app
  name: travel-app
  namespace: travel
spec:
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  selector:
    app: travel-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-app
  namespace: travel
spec:
  minReadySeconds: 5
  replicas: 1
  selector:
    matchLabels:
      app: travel-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: travel-app
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: travel-db
        - name: CF_ACCESS_TEAM_DOMAIN
          valueFrom:
            secretKeyRef:
              key: teamDomain
              name: travel-cf-access
        - name: CF_ACCESS_AUD
          valueFrom:
            secretKeyRef:
              key: aud
              name: travel-cf-access
        - name: CALENDAR_FEED_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: travel-calendar-feed
        image: localhost:30500/travel-app:2afbea271c57902ba68032dc289942461f46cb73
        livenessProbe:
          failureThreshold: 8
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
        name: travel-app
        ports:
        - containerPort: 3000
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/run/secrets/wac-suite
          name: wac-suite-token
          readOnly: true
      serviceAccountName: travel-app
      volumes:
      - name: wac-suite-token
        projected:
          sources:
          - serviceAccountToken:
              audience: wac-suite-internal
              expirationSeconds: 3600
              path: token
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
  name: travel-migrate
  namespace: travel
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
      - command:
        - node
        - dist/worker/migrate.js
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: travel-db
        image: localhost:30500/travel-app:2afbea271c57902ba68032dc289942461f46cb73
        name: travel-app
      restartPolicy: Never
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: travel-travel-stripprefix@kubernetescrd
  name: travel-app-path
  namespace: travel
spec:
  ingressClassName: traefik
  rules:
  - host: wacwini.com
    http:
      paths:
      - backend:
          service:
            name: travel-app
            port:
              number: 3000
        path: /travel
        pathType: Prefix
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: travel-stripprefix
  namespace: travel
spec:
  stripPrefix:
    prefixes:
    - /travel
