name: lab-release
description: Obtain GitHub OIDC authorization and verify Lab's fixed migration evidence through Lab's TLS service
inputs:
  operation:
    description: migrate, the only operation Lab's service accepts from this action
    required: true
  image_tag:
    description: Warehouse image tag for migrate
    default: ""
  image_digest:
    description: Warehouse image digest for migrate
    default: ""
  wait_timeout:
    description: Overall evidence deadline in seconds, at most 3600
    default: "2100"
outputs:
  receipt:
    description: Local JSON receipt path, suitable for the caller's artifact upload
    value: ${{ steps.release.outputs.receipt }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Verify the scoped release
      id: release
      shell: bash
      env:
        RELEASE_OPERATION: ${{ inputs.operation }}
        RELEASE_TAG: ${{ inputs.image_tag }}
        RELEASE_DIGEST: ${{ inputs.image_digest }}
        RELEASE_TIMEOUT: ${{ inputs.wait_timeout }}
      run: |
        set -euo pipefail
        receipt="$(mktemp "$RUNNER_TEMP/release-receipt.XXXXXX.json")"
        python "${{ github.action_path }}/../scripts/ci-release.py" \
          --operation "$RELEASE_OPERATION" --image-tag "$RELEASE_TAG" \
          --image-digest "$RELEASE_DIGEST" \
          --wait-timeout "$RELEASE_TIMEOUT" --receipt "$receipt"
        echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
