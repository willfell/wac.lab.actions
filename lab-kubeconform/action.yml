name: lab-kubeconform
description: Validate a kustomize overlay by piping its build through kubeconform
inputs:
  kustomize_dir:
    description: Directory holding the kustomization to validate
    required: true
  flags:
    description: Flags passed to kubeconform
    default: -strict -summary
  kustomize_version:
    description: kustomize release to install
    default: v5.7.1
  kubeconform_version:
    description: kubeconform release to install
    default: v0.7.0
  github_token:
    description: GitHub token for upstream public schema API rate limits
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install kustomize and kubeconform
      shell: bash
      env:
        KUSTOMIZE_VERSION: ${{ inputs.kustomize_version }}
        KUBECONFORM_VERSION: ${{ inputs.kubeconform_version }}
      run: |
        "${{ github.action_path }}/../scripts/install-tools.sh" kustomize,kubeconform
    - name: Validate
      shell: bash
      env:
        KUSTOMIZE_DIR: ${{ inputs.kustomize_dir }}
        FLAGS: ${{ inputs.flags }}
        SCHEMA_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        bash "${{ github.action_path }}/../scripts/validate-kustomize.sh"
