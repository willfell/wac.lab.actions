name: actionlint

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label; empty uses the caller's CI_RUNNER_SMALL variable
        type: string
        default: ''
      runner_policy:
        description: Runner policy mode, legacy or fleet
        type: string
        default: legacy
      transitional_labels:
        description: Repository pool labels admitted before organization transfer
        type: string
        default: ''
      allowed_host_labels:
        description: Explicit host runner labels, separated by spaces or commas
        type: string
        default: ''

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provide the linters actionlint shells out to
        run: |
          set -eu
          install=""
          /usr/bin/python3 -c "import yaml" >/dev/null 2>&1 || install=yes
          command -v pipx >/dev/null 2>&1 || install=yes
          command -v shellcheck >/dev/null 2>&1 || install=yes
          if [ -n "$install" ]; then
            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends pipx shellcheck python3-yaml
            else
              echo "::warning::pipx/shellcheck absent and no apt-get here; actionlint will attempt its own install"
            fi
          fi
      - uses: raven-actions/actionlint@v2
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .runner-policy-gate
          persist-credentials: false
      - name: Validate runner routing
        if: success() || failure()
        env:
          RUNNER_POLICY: ${{ inputs.runner_policy }}
          POLICY_RUNNER: ${{ inputs.runner }}
          TRANSITIONAL_LABELS: ${{ inputs.transitional_labels }}
          ALLOWED_HOST_LABELS: ${{ inputs.allowed_host_labels }}
        run: |
          /usr/bin/python3 .runner-policy-gate/scripts/runner-policy.py \
            --policy "$RUNNER_POLICY" --runner "$POLICY_RUNNER" \
            --transitional-labels "$TRANSITIONAL_LABELS" \
            --allowed-host-labels "$ALLOWED_HOST_LABELS"
