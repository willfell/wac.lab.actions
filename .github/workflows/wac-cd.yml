name: wac-cd

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label; empty uses the caller's CI_RUNNER_SMALL variable
        type: string
        default: ''
      build_runner:
        description: Runner label for the job that builds; empty uses runner
        type: string
        default: ''
      version_source:
        description: commits computes the version from conventional commits; caller takes it from the version input
        type: string
        default: commits
      version:
        description: Caller-computed bare X.Y.Z when version_source is caller; empty means no release
        type: string
        default: ''
      rollback_version:
        description: Published version to release again; only on workflow_dispatch
        type: string
        default: ''
      settings_revision:
        description: hemi's revision to release on the running code with no build; only on workflow_dispatch
        type: string
        default: ''
      deploy:
        description: false publishes the images, chart and tag without releasing them
        type: boolean
        default: true
      build_args:
        description: Newline-separated KEY=VALUE build args passed to every image build
        type: string
        default: ''
      wait_timeout:
        description: Seconds to wait out an unavailable gateway in plan, and for the gateway release proof; the health check has its own fixed 300 seconds
        type: string
        default: '2100'
    secrets:
      npm_token:
        description: Token for private npm packages; empty uses the job's GitHub token
        required: false
    outputs:
      mode:
        description: release, publish, resume, rollback, settings or none
        value: ${{ jobs.plan.outputs.mode }}
      version:
        description: The released or published version, bare X.Y.Z
        value: ${{ jobs.plan.outputs.version }}
      tag:
        description: The git tag for the version
        value: ${{ jobs.plan.outputs.tag }}
      images:
        description: JSON map of built or retagged images with digests; empty on resume and rollback
        value: ${{ jobs.build.outputs.images || jobs.retag.outputs.images }}

permissions:
  contents: read

concurrency:
  group: wac-cd-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    timeout-minutes: 40
    env:
      PYTHONSAFEPATH: "1"
    permissions:
      contents: write
      id-token: write
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      expected_sha: ${{ steps.version.outputs.expected_sha }}
      app: ${{ steps.profile.outputs.app }}
      chart_version: ${{ steps.profile.outputs.chart_version }}
      values_file: ${{ steps.profile.outputs.values_file }}
      tag_prefix: ${{ steps.profile.outputs.tag_prefix }}
      health_url: ${{ steps.profile.outputs.health_url }}
      health_expect_db_ok: ${{ steps.profile.outputs.health_expect_db_ok }}
      images: ${{ steps.profile.outputs.images }}
      source: ${{ steps.contract.outputs.source }}
      revision: ${{ steps.contract.outputs.revision }}
      fleet_commit: ${{ steps.contract.outputs.fleet_commit }}
      source_images: ${{ steps.settings.outputs.images }}
    steps:
      - name: Require the runner's python3 3.12 or later
        timeout-minutes: 1
        shell: bash
        env:
          JOB_RUNNER_NAME: ${{ runner.name }}
          JOB_RUNNER_OS: ${{ runner.os }}
          JOB_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          modules=(argparse base64 binascii errno hashlib http.client importlib.util json os pathlib re shutil signal socket ssl stat subprocess sys tempfile threading time typing urllib.error urllib.parse urllib.request uuid)
          python="$(command -v python3 || true)"
          found="no python3"
          if [[ -n "$python" ]]; then
            version="$("$python" -I -c 'import sys; print("Python " + sys.version.split()[0])' 2> /dev/null || echo "an unreadable python3")"
            found="$version at $python"
            if "$python" -I -c 'import sys; sys.exit(sys.version_info < (3, 12))' 2> /dev/null; then
              if missing="$("$python" -I -c 'import importlib, sys
          for name in sys.argv[1:]:
              try:
                  importlib.import_module(name)
              except Exception:
                  print(name)
                  sys.exit(1)' "${modules[@]}" 2> /dev/null)"; then
                exit 0
              fi
              found="$found, which cannot import ${missing:-its standard modules}"
            fi
          fi
          echo "::error::wac-cd: plan needs python3 3.12 or later on the runner; found $found on $JOB_RUNNER_NAME ($JOB_RUNNER_OS, $JOB_RUNNER_ARCH)."
          exit 1
      - name: Check the trigger
        timeout-minutes: 1
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          SETTINGS_REVISION: ${{ inputs.settings_revision }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::wac-cd: $1"
            exit 1
          }
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          revision='^[1-9][0-9]{0,9}$'
          settings="${SETTINGS_REVISION:-}"
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail "runs only on refs/heads/main, not $GITHUB_REF"
          case "$EVENT_NAME" in
            push)
              [[ -z "$ROLLBACK_VERSION" ]] || fail "rollback_version is accepted only on workflow_dispatch"
              [[ -z "$settings" ]] || fail "settings_revision is accepted only on workflow_dispatch"
              ;;
            workflow_dispatch)
              if [[ -n "$ROLLBACK_VERSION" && -n "$settings" ]]; then
                fail "workflow_dispatch takes rollback_version or settings_revision, not both"
              elif [[ -n "$settings" ]]; then
                [[ "$settings" =~ $revision ]] || fail "settings_revision must be a whole number from 1 to 9999999999, not $settings"
              elif [[ -z "$ROLLBACK_VERSION" ]]; then
                fail "workflow_dispatch needs exactly one of rollback_version (X.Y.Z) and settings_revision"
              else
                [[ "$ROLLBACK_VERSION" =~ $semver ]] || fail "workflow_dispatch needs rollback_version as X.Y.Z"
              fi
              ;;
            *)
              fail "event $EVENT_NAME is not push or workflow_dispatch"
              ;;
          esac
          if [[ -n "$ROLLBACK_VERSION" && "$DEPLOY" != true ]]; then
            fail "rollback_version cannot be combined with deploy: false"
          fi
          if [[ -n "$settings" && "$DEPLOY" != true ]]; then
            fail "settings_revision cannot be combined with deploy: false"
          fi
      - name: Check out the app (actions/checkout v7.0.1)
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Require the defining workflow commit
        timeout-minutes: 1
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .wacd
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        timeout-minutes: 1
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wacd"
          mv .wacd "$RUNNER_TEMP/wacd"
          echo "WACD_SCRIPTS=$RUNNER_TEMP/wacd/scripts" >> "$GITHUB_ENV"
      - name: Read the settings from the gateway
        id: contract
        shell: bash
        env:
          WAIT_TIMEOUT: ${{ inputs.wait_timeout }}
        run: |
          set -euo pipefail
          if ! python3 "$WACD_SCRIPTS"/wacd-contract.py fetch --out .wacd-contract --wait-timeout "$WAIT_TIMEOUT" \
            > "$RUNNER_TEMP/contract.out" 2> "$RUNNER_TEMP/contract.err"; then
            echo "::error::wac-cd: $(tr '\n' ' ' < "$RUNNER_TEMP/contract.err")"
            exit 1
          fi
          cat "$RUNNER_TEMP/contract.out" >> "$GITHUB_OUTPUT"
      - name: Upload the settings copy (actions/upload-artifact v7.0.2)
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.contract.outputs.source == 'hemi'
        with:
          name: wac-cd-contract
          path: .wacd-contract/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Read the wacd profile
        timeout-minutes: 1
        id: profile
        shell: bash
        env:
          SOURCE: ${{ steps.contract.outputs.source }}
        run: |
          if [[ "$SOURCE" == hemi ]]; then
            python3 "$WACD_SCRIPTS"/wacd-profile.py --contract .wacd-contract/contract.json >> "$GITHUB_OUTPUT"
          else
            python3 "$WACD_SCRIPTS"/wacd-profile.py .github/wacd.json >> "$GITHUB_OUTPUT"
          fi
      - name: Plan the settings release
        timeout-minutes: 6
        id: settings
        if: inputs.settings_revision != ''
        shell: bash
        env:
          SETTINGS_REVISION: ${{ inputs.settings_revision }}
          SOURCE: ${{ steps.contract.outputs.source }}
          COPY_REVISION: ${{ steps.contract.outputs.revision }}
          APP: ${{ steps.profile.outputs.app }}
          TAG_PREFIX: ${{ steps.profile.outputs.tag_prefix }}
          PROFILE_IMAGES: ${{ steps.profile.outputs.images }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 120 ))
          fail() {
            echo "wac-cd: $1" >&2
            echo "::error::wac-cd: $1"
            {
              echo "### wac-cd plan"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          call() {
            local name="$1" script="$2" value
            shift 2
            if ! value="$(python3 "$WACD_SCRIPTS/$script" "$@" 2> "$RUNNER_TEMP/settings.err")"; then
              fail "$(tr '\r\n' '  ' < "$RUNNER_TEMP/settings.err" | sed 's/ *$//')"
            fi
            printf -v "$name" '%s' "$value"
          }
          if [[ "$SOURCE" != hemi ]]; then
            fail "Settings revision $SETTINGS_REVISION cannot be released on its own: this app's settings come from its files, not from hemi's copy."
          fi
          if (( COPY_REVISION > SETTINGS_REVISION )); then
            {
              echo "mode=none"
              echo "summary=a newer revision is live; its own release follows"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( COPY_REVISION < SETTINGS_REVISION )); then
            fail "hemi's copy is at revision $COPY_REVISION, older than the dispatched revision $SETTINGS_REVISION; re-run once the save has reached the fleet copy."
          fi
          code=0
          status="$(python3 "$WACD_SCRIPTS"/wacd-release.py running --app "$APP" --wait-timeout 120 \
            --deadline "$deadline" 2> "$RUNNER_TEMP/settings.err")" || code=$?
          if [[ "$code" -eq 3 ]]; then
            reason="$(tr '\r\n' '  ' < "$RUNNER_TEMP/settings.err" | sed 's/^wacd release: //; s/ *$//')"
            [[ -n "$reason" ]] || fail "The settings release was refused while the app rolls out, and the refusal gave no reason."
            printf 'rollout_refused=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            echo "wac-cd: settings release refused while the app rolls out; the next step reports it"
            exit 0
          elif [[ "$code" -ne 0 ]]; then
            fail "$(tr '\r\n' '  ' < "$RUNNER_TEMP/settings.err" | sed 's/ *$//')"
          fi
          running="$(sed -n 's/^running=//p' <<< "$status")"
          commit="$(sed -n 's/^commit=//p' <<< "$status")"
          images="$(sed -n 's/^images=//p' <<< "$status")"
          live="$(sed -n 's/^copy_revision=//p' <<< "$status")"
          if ! python3 -I -c 'import json, sys
          running = sorted(json.loads(sys.argv[1]))
          wanted = sorted(image["name"] for image in json.loads(sys.argv[2]))
          sys.exit(running != wanted)' "$images" "$PROFILE_IMAGES"; then
            fail "hemi's copy names other images than $running runs, so its settings need a build: release code first."
          fi
          call planned wacd-version.py --mode settings --prefix "$TAG_PREFIX" --commit "$commit" --running "$running"
          version="$(sed -n 's/^version=//p' <<< "$planned")"
          claimed="$(sed -n 's/^claimed=//p' <<< "$planned")"
          above="$(sed -n 's/^above=//p' <<< "$planned")"
          codes="$(sed -n 's/^codes=//p' <<< "$planned")"
          code=0
          python3 "$WACD_SCRIPTS"/wacd-release.py unfinished-release --app "$APP" --prefix "$TAG_PREFIX" \
            --running "$running" --versions "$above" --codes "$codes" \
            --deadline "$deadline" > /dev/null 2> "$RUNNER_TEMP/settings.err" || code=$?
          if [[ "$code" -eq 5 ]]; then
            reason="$(tr '\r\n' '  ' < "$RUNNER_TEMP/settings.err" | sed 's/^wacd release: //; s/ *$//')"
            [[ -n "$reason" ]] || fail "The settings release was refused behind an unfinished code release, and the refusal gave no reason."
            printf 'unfinished_refused=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            echo "wac-cd: settings release refused behind an unfinished code release; the next step reports it"
            exit 0
          elif [[ "$code" -ne 0 ]]; then
            fail "$(tr '\r\n' '  ' < "$RUNNER_TEMP/settings.err" | sed 's/ *$//')"
          fi
          if [[ "$live" == "$SETTINGS_REVISION" ]]; then
            version="$running"
          else
            code=0
            earlier="$(python3 "$WACD_SCRIPTS"/wacd-release.py earlier-release --app "$APP" --prefix "$TAG_PREFIX" \
              --revision "$SETTINGS_REVISION" --running "$running" --versions "$above" --claimed "$claimed" \
              --deadline "$deadline" 2> "$RUNNER_TEMP/settings.err")" || code=$?
            if [[ "$code" -eq 4 ]]; then
              reason="$(tr '\r\n' '  ' < "$RUNNER_TEMP/settings.err" | sed 's/^wacd release: //; s/ *$//')"
              fail "${reason:-The settings release was refused because the revision was already released, and the refusal gave no reason.}"
            elif [[ "$code" -ne 0 ]]; then
              fail "$(tr '\r\n' '  ' < "$RUNNER_TEMP/settings.err" | sed 's/ *$//')"
            fi
            reuse="${earlier#reuse=}"
            version="${reuse:-$version}"
          fi
          summary="settings revision $SETTINGS_REVISION on $running's code (${commit:0:12}), released as $version"
          if [[ "$version" != "$running" ]]; then
            code=0
            git diff --quiet "$commit" origin/main -- .github/workflows || code=$?
            if [[ "$code" -eq 1 ]]; then
              printf 'workflow_refused=%s\n' "Release code first: $APP's workflow files changed since $running, so its settings cannot be released on ${commit:0:12}." >> "$GITHUB_OUTPUT"
              echo "wac-cd: settings release refused; the next step reports it"
              exit 0
            elif [[ "$code" -ne 0 ]]; then
              fail "could not compare $commit's workflow files with origin/main"
            fi
          fi
          {
            echo "mode=settings"
            echo "version=$version"
            echo "tag=$TAG_PREFIX$version"
            echo "commit=$commit"
            echo "images=$images"
            echo "summary=$summary"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Refuse a settings release while the app is rolling out
        timeout-minutes: 1
        if: ${{ steps.settings.outputs.rollout_refused != '' }}
        shell: bash
        env:
          REASON: ${{ steps.settings.outputs.rollout_refused }}
        run: |
          echo "wac-cd: $REASON" >&2
          echo "::error::wac-cd: $REASON"
          {
            echo "### wac-cd plan"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Refuse a settings release behind an unfinished code release
        timeout-minutes: 1
        if: ${{ steps.settings.outputs.unfinished_refused != '' }}
        shell: bash
        env:
          REASON: ${{ steps.settings.outputs.unfinished_refused }}
        run: |
          echo "wac-cd: $REASON" >&2
          echo "::error::wac-cd: $REASON"
          {
            echo "### wac-cd plan"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Refuse a settings release behind a workflow change
        timeout-minutes: 1
        if: ${{ steps.settings.outputs.workflow_refused != '' }}
        shell: bash
        env:
          REASON: ${{ steps.settings.outputs.workflow_refused }}
        run: |
          echo "wac-cd: $REASON" >&2
          echo "::error::wac-cd: $REASON"
          {
            echo "### wac-cd plan"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Plan the version
        timeout-minutes: 6
        id: version
        shell: bash
        env:
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
          VERSION_SOURCE: ${{ inputs.version_source }}
          CALLER_VERSION: ${{ inputs.version }}
          DEPLOY: ${{ inputs.deploy }}
          APP: ${{ steps.profile.outputs.app }}
          TAG_PREFIX: ${{ steps.profile.outputs.tag_prefix }}
          SETTINGS_REVISION: ${{ inputs.settings_revision }}
          SETTINGS_MODE: ${{ steps.settings.outputs.mode }}
          SETTINGS_VERSION: ${{ steps.settings.outputs.version }}
          SETTINGS_TAG: ${{ steps.settings.outputs.tag }}
          SETTINGS_COMMIT: ${{ steps.settings.outputs.commit }}
          SETTINGS_SUMMARY: ${{ steps.settings.outputs.summary }}
        run: |
          set -euo pipefail
          registry=registry.network.svc.cluster.local:5000
          revision_of() {
            local line
            line="$(python3 "$WACD_SCRIPTS"/wacd-chart.py chart-revision --registry "$registry" --app "$APP" --version "$1")"
            revision="${line#revision=}"
          }
          if [[ -n "$ROLLBACK_VERSION" ]]; then
            revision_of "$ROLLBACK_VERSION"
            if ! git merge-base --is-ancestor "$revision" "$GITHUB_SHA"; then
              echo "::error::wac-cd: deploy/$APP:$ROLLBACK_VERSION was built from $revision, which is not an ancestor of main"
              exit 1
            fi
            mode=rollback
            version="$ROLLBACK_VERSION"
            tag="$TAG_PREFIX$ROLLBACK_VERSION"
            expected_sha="$revision"
          elif [[ -n "${SETTINGS_REVISION:-}" ]]; then
            mode="${SETTINGS_MODE:-}"
            version="${SETTINGS_VERSION:-}"
            tag="${SETTINGS_TAG:-}"
            expected_sha="${SETTINGS_COMMIT:-}"
            if [[ "$mode" != settings && "$mode" != none ]]; then
              echo "::error::wac-cd: the settings release was not planned"
              exit 1
            fi
          else
            plan_version() {
              local planned
              local reason
              local code=0
              planned="$(python3 "$WACD_SCRIPTS"/wacd-version.py --prefix "$TAG_PREFIX" \
                --version-source "$VERSION_SOURCE" --version "$CALLER_VERSION" --deploy "$DEPLOY" \
                --published "$1" 2> "$RUNNER_TEMP/version.err")" || code=$?
              if [[ "$code" -ne 0 ]]; then
                reason="$(tr '\r\n' '  ' < "$RUNNER_TEMP/version.err" | sed 's/^wacd version: //; s/ *$//')"
                if [[ "$code" -eq 3 && -z "$reason" ]]; then
                  code=1
                  reason="This run was refused as a replay of an old version, and the refusal gave no reason."
                fi
                if [[ "$code" -eq 3 ]]; then
                  printf 'replay_refused=%s\n' "$reason" >> "$GITHUB_OUTPUT"
                  echo "wac-cd: replay refused; the next step reports it"
                  exit 0
                fi
                echo "wac-cd: $reason" >&2
                echo "::error::wac-cd: $reason"
                {
                  echo "### wac-cd plan"
                  echo
                  echo "$reason"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              mode="$(sed -n 's/^mode=//p' <<< "$planned")"
              version="$(sed -n 's/^version=//p' <<< "$planned")"
              tag="$(sed -n 's/^tag=//p' <<< "$planned")"
            }
            plan_version unknown
            if [[ "$mode" == resume || ( "$mode" == none && -n "$version" ) ]]; then
              if ! state="$(python3 "$WACD_SCRIPTS"/wacd-chart.py chart-state --registry "$registry" \
                --app "$APP" --version "$version" --source-sha "$GITHUB_SHA" 2> "$RUNNER_TEMP/chart-state.err")"; then
                echo "::error::wac-cd: $(tr '\n' ' ' < "$RUNNER_TEMP/chart-state.err")"
                exit 1
              fi
              case "$state" in
                state=present) plan_version true ;;
                state=absent) plan_version false ;;
                *)
                  echo "::error::wac-cd: unexpected chart state for deploy/$APP:$version: $state"
                  exit 1
                  ;;
              esac
            fi
            expected_sha="$GITHUB_SHA"
          fi
          resumed=""
          if [[ "$mode" == resume ]]; then
            published="$(python3 "$WACD_SCRIPTS"/wacd-chart.py chart-copy-revision --registry "$registry" \
              --app "$APP" --version "$version" 2> /dev/null || true)"
            case "${published#copy_revision=}" in
              none) resumed="Resuming $version, whose chart was published from the repository's files." ;;
              [1-9]*)
                if [[ "${published#copy_revision=}" =~ ^[1-9][0-9]{0,9}$ ]]; then
                  resumed="Resuming $version, whose chart was published with settings revision ${published#copy_revision=}."
                fi
                ;;
            esac
            resumed="${resumed:-Resuming $version; the settings revision its chart was published with could not be read.}"
          fi
          superseded=""
          if [[ "$mode" == release || "$mode" == publish ]]; then
            if ! claimed="$(python3 "$WACD_SCRIPTS"/wacd-tag.py claim-tag --tag "$tag" --sha "$GITHUB_SHA" \
              --branch main 2> "$RUNNER_TEMP/claim-tag.err")"; then
              echo "::error::wac-cd: $(tr '\n' ' ' < "$RUNNER_TEMP/claim-tag.err")"
              exit 1
            fi
            echo "$claimed"
            if [[ "$(sed -n 's/^claim=//p' <<< "$claimed")" == superseded ]]; then
              superseded="$(head -n 1 <<< "$claimed")"
              mode=none
              version=""
              tag=""
            fi
          elif [[ "$mode" == settings ]]; then
            if ! claimed="$(python3 "$WACD_SCRIPTS"/wacd-tag.py claim-tag --tag "$tag" --commit "$expected_sha" \
              2> "$RUNNER_TEMP/claim-tag.err")"; then
              echo "::error::wac-cd: $(tr '\n' ' ' < "$RUNNER_TEMP/claim-tag.err")"
              exit 1
            fi
            echo "$claimed"
            case "$(sed -n 's/^claim=//p' <<< "$claimed")" in
              pushed|exists) ;;
              *)
                echo "::error::wac-cd: the settings tag $tag was not claimed on $expected_sha"
                exit 1
                ;;
            esac
          fi
          {
            echo "mode=$mode"
            echo "version=$version"
            echo "tag=$tag"
            echo "expected_sha=$expected_sha"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### wac-cd plan"
            echo
            echo "| mode | version | tag | expected sha |"
            echo "| --- | --- | --- | --- |"
            echo "| $mode | ${version:--} | ${tag:--} | $expected_sha |"
            if [[ -n "$superseded" ]]; then
              echo
              echo "Superseded: $superseded. Nothing was built or published; the newer run releases these commits cumulatively."
            fi
            if [[ -n "$resumed" ]]; then
              echo
              echo "$resumed"
            fi
            if [[ -n "${SETTINGS_REVISION:-}" && "$mode" == settings ]]; then
              echo
              echo "mode: settings"
              echo
              echo "${SETTINGS_SUMMARY:-}"
            elif [[ -n "${SETTINGS_REVISION:-}" ]]; then
              echo
              echo "mode: none (${SETTINGS_SUMMARY:-})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse to replay an old version
        timeout-minutes: 1
        if: ${{ steps.version.outputs.replay_refused != '' }}
        shell: bash
        env:
          REASON: ${{ steps.version.outputs.replay_refused }}
        run: |
          echo "wac-cd: $REASON" >&2
          echo "::error::wac-cd: $REASON"
          {
            echo "### wac-cd plan"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  shadow:
    needs: plan
    if: needs.plan.outputs.mode != 'none' && needs.plan.outputs.source == 'files'
    continue-on-error: true
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    timeout-minutes: 2
    env:
      PYTHONSAFEPATH: "1"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Start the clock
        shell: bash
        run: echo "WACD_SHADOW_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Require the runner's python3 3.12 or later
        timeout-minutes: 1
        shell: bash
        env:
          JOB_RUNNER_NAME: ${{ runner.name }}
          JOB_RUNNER_OS: ${{ runner.os }}
          JOB_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          modules=(argparse base64 binascii errno hashlib http.client importlib.util json os pathlib re shutil signal socket ssl stat subprocess sys tempfile threading time typing urllib.error urllib.parse urllib.request uuid)
          python="$(command -v python3 || true)"
          found="no python3"
          if [[ -n "$python" ]]; then
            version="$("$python" -I -c 'import sys; print("Python " + sys.version.split()[0])' 2> /dev/null || echo "an unreadable python3")"
            found="$version at $python"
            if "$python" -I -c 'import sys; sys.exit(sys.version_info < (3, 12))' 2> /dev/null; then
              if missing="$("$python" -I -c 'import importlib, sys
          for name in sys.argv[1:]:
              try:
                  importlib.import_module(name)
              except Exception:
                  print(name)
                  sys.exit(1)' "${modules[@]}" 2> /dev/null)"; then
                exit 0
              fi
              found="$found, which cannot import ${missing:-its standard modules}"
            fi
          fi
          echo "::error::wac-cd: shadow needs python3 3.12 or later on the runner; found $found on $JOB_RUNNER_NAME ($JOB_RUNNER_OS, $JOB_RUNNER_ARCH)."
          exit 1
      - name: Check out the app (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .wacd
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wacd"
          mv .wacd "$RUNNER_TEMP/wacd"
          echo "WACD_SCRIPTS=$RUNNER_TEMP/wacd/scripts" >> "$GITHUB_ENV"
      - name: Install helm
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: bash "$WACD_SCRIPTS"/install-helm.sh --max-time 25 --attempts 1
      - name: Compare hemi's copy with the files
        shell: bash
        run: python3 "$WACD_SCRIPTS"/wacd-shadow.py .github/wacd.json

  build:
    needs: plan
    if: needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'publish'
    runs-on: ${{ inputs.build_runner || inputs.runner || vars.CI_RUNNER_SMALL }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Check out the app (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .wacd
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wacd"
          mv .wacd "$RUNNER_TEMP/wacd"
          echo "WACD_SCRIPTS=$RUNNER_TEMP/wacd/scripts" >> "$GITHUB_ENV"
      - name: Set up Python (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install crane
        shell: bash
        env:
          CRANE_VERSION: v0.20.6
        run: bash "$WACD_SCRIPTS"/install-tools.sh crane
      - name: Build and push the images
        id: images
        shell: bash
        env:
          PROFILE_IMAGES: ${{ needs.plan.outputs.images }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_ARGS: ${{ inputs.build_args }}
          NODE_AUTH_TOKEN: ${{ secrets.npm_token || github.token }}
        run: |
          set -euo pipefail
          registry=registry.network.svc.cluster.local:5000
          validated="$(python3 "$WACD_SCRIPTS"/wacd-chart.py build-args --text="$BUILD_ARGS")"
          extra=()
          if [[ -n "$validated" ]]; then
            while IFS= read -r line; do
              extra+=(--build-arg "$line")
            done <<< "$validated"
          fi
          python3 -c 'import json, os
          for image in json.loads(os.environ["PROFILE_IMAGES"]):
              print("\t".join([image["name"], image["dockerfile"], image["context"], image.get("sha_build_arg", "")]))' \
            > "$RUNNER_TEMP/images.tsv"
          : > "$RUNNER_TEMP/digests.tsv"
          image_state() {
            local err="$RUNNER_TEMP/image-state.err"
            if ! state="$(python3 "$WACD_SCRIPTS"/wacd-chart.py image-state --registry "$registry" \
              --name "$1" --tag "$VERSION" --source-sha "$GITHUB_SHA" 2> "$err")"; then
              echo "::error::wac-cd: $(tr '\n' ' ' < "$err")"
              exit 1
            fi
          }
          while IFS=$'\t' read -r name dockerfile context sha_arg <&3; do
            ref="$registry/$name:$VERSION"
            image_state "$name"
            if [[ "$state" == state=absent ]]; then
              args=(-f "$dockerfile" --label "org.opencontainers.image.revision=$GITHUB_SHA")
              if [[ -n "$sha_arg" ]]; then
                args+=(--build-arg "$sha_arg=$GITHUB_SHA")
              fi
              args+=("${extra[@]}")
              args+=(--secret "id=node_auth_token,env=NODE_AUTH_TOKEN" -t "$name:$VERSION" "$context")
              docker build "${args[@]}"
              docker save "$name:$VERSION" -o "$RUNNER_TEMP/image.tar"
              crane push --insecure "$RUNNER_TEMP/image.tar" "$ref"
              rm -f "$RUNNER_TEMP/image.tar"
              image_state "$name"
              if [[ "$state" != state=present ]]; then
                echo "::error::wac-cd: $ref is not readable from $GITHUB_SHA after the push: $state"
                exit 1
              fi
            elif [[ "$state" != state=present ]]; then
              echo "::error::wac-cd: unexpected image state for $ref: $state"
              exit 1
            else
              echo "$ref already exists from $GITHUB_SHA; reusing it"
            fi
            digest="$(crane digest --insecure "$ref")"
            echo "$ref @ $digest"
            printf '%s\t%s\n' "$name" "$digest" >> "$RUNNER_TEMP/digests.tsv"
          done 3< "$RUNNER_TEMP/images.tsv"
          python3 -c 'import json, os, re, sys
          version = os.environ["VERSION"]
          images = {}
          for line in open(sys.argv[1]):
              name, digest = line.rstrip("\n").split("\t")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  sys.exit(f"wac-cd: {name} has no valid digest")
              images[name] = {"repository": "localhost:30500/" + name, "tag": version, "digest": digest}
          print("images=" + json.dumps(images, separators=(",", ":"), sort_keys=True))' \
            "$RUNNER_TEMP/digests.tsv" >> "$GITHUB_OUTPUT"

  retag:
    needs: plan
    if: needs.plan.outputs.mode == 'settings'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.retag.outputs.images }}
    steps:
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .wacd
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wacd"
          mv .wacd "$RUNNER_TEMP/wacd"
          echo "WACD_SCRIPTS=$RUNNER_TEMP/wacd/scripts" >> "$GITHUB_ENV"
      - name: Set up Python (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Retag the running images
        id: retag
        shell: bash
        env:
          SOURCE_IMAGES: ${{ needs.plan.outputs.source_images }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 "$WACD_SCRIPTS"/wacd-retag.py --images "$SOURCE_IMAGES" --version "$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: [plan, build, retag]
    if: >-
      !cancelled() && !failure() && (
      needs.plan.outputs.mode == 'release' ||
      needs.plan.outputs.mode == 'publish' ||
      needs.plan.outputs.mode == 'settings')
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the app (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .wacd
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wacd"
          mv .wacd "$RUNNER_TEMP/wacd"
          echo "WACD_SCRIPTS=$RUNNER_TEMP/wacd/scripts" >> "$GITHUB_ENV"
      - name: Set up Python (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install helm
        shell: bash
        run: bash "$WACD_SCRIPTS"/install-helm.sh --max-time 120 --attempts 3
      - name: Pull the wac-app chart
        id: pull
        shell: bash
        env:
          CHART_VERSION: ${{ needs.plan.outputs.chart_version }}
        run: |
          set -euo pipefail
          helm pull oci://registry.network.svc.cluster.local:5000/charts/wac-app \
            --version "$CHART_VERSION" --plain-http -d "$RUNNER_TEMP"
          tgz="$RUNNER_TEMP/wac-app-$CHART_VERSION.tgz"
          test -f "$tgz"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
      - name: Clear any copy in the checkout
        shell: bash
        run: rm -rf .wacd-contract
      - name: Download the settings copy plan read (actions/download-artifact v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.source == 'hemi'
        with:
          name: wac-cd-contract
          path: .wacd-contract
      - name: Publish the deploy chart and the tag
        shell: bash
        env:
          APP: ${{ needs.plan.outputs.app }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          MODE: ${{ needs.plan.outputs.mode }}
          EXPECTED_SHA: ${{ needs.plan.outputs.expected_sha }}
          IMAGES: ${{ needs.build.outputs.images || needs.retag.outputs.images }}
          WAC_APP_TGZ: ${{ steps.pull.outputs.tgz }}
          SOURCE: ${{ needs.plan.outputs.source }}
          REVISION: ${{ needs.plan.outputs.revision }}
          FLEET_COMMIT: ${{ needs.plan.outputs.fleet_commit }}
        run: |
          set -euo pipefail
          registry=registry.network.svc.cluster.local:5000
          source_sha="$GITHUB_SHA"
          if [[ "${MODE:-}" == settings ]]; then
            source_sha="$EXPECTED_SHA"
          fi
          profile=.github/wacd.json
          copy=()
          if [[ "$SOURCE" == hemi ]]; then
            profile=.wacd-contract/profile.json
            copy+=(--values-json .wacd-contract/values.json)
          fi
          if [[ -n "$REVISION" ]]; then
            copy+=(--annotation "wacwini.com/revision=$REVISION" --annotation "wacwini.com/fleet-commit=$FLEET_COMMIT")
          fi
          chart_state() {
            local err="$RUNNER_TEMP/chart-state.err"
            if ! state="$(python3 "$WACD_SCRIPTS"/wacd-chart.py chart-state --registry "$registry" \
              --app "$APP" --version "$VERSION" --source-sha "$source_sha" 2> "$err")"; then
              echo "::error::wac-cd: $(tr '\n' ' ' < "$err")"
              exit 1
            fi
          }
          chart_state
          if [[ "$state" == state=absent ]]; then
            line="$(python3 "$WACD_SCRIPTS"/wacd-chart.py package --profile "$profile" \
              --version "$VERSION" --source-sha "$source_sha" --images "$IMAGES" \
              --wac-app-tgz "$WAC_APP_TGZ" --out "$RUNNER_TEMP/deploy-chart" ${copy[@]+"${copy[@]}"})"
            chart_dir="${line#chart_dir=}"
            helm package "$chart_dir" -d "$RUNNER_TEMP/packaged"
            tgz="$RUNNER_TEMP/packaged/$APP-$VERSION.tgz"
            test -f "$tgz"
            helm push "$tgz" "oci://$registry/deploy" --plain-http
            chart_state
            if [[ "$state" != state=present ]]; then
              echo "::error::wac-cd: deploy/$APP:$VERSION is not readable after the push"
              exit 1
            fi
          elif [[ "$state" == state=present ]]; then
            echo "deploy/$APP:$VERSION is already published from $source_sha"
          else
            echo "::error::wac-cd: unexpected chart state for deploy/$APP:$VERSION: $state"
            exit 1
          fi
          python3 "$WACD_SCRIPTS"/wacd-tag.py push-tag --tag "$TAG" --sha "$source_sha"

  deploy:
    needs: [plan, build, retag, publish]
    if: >-
      !cancelled() && !failure() && (
      needs.plan.outputs.mode == 'release' ||
      needs.plan.outputs.mode == 'resume' ||
      needs.plan.outputs.mode == 'rollback' ||
      needs.plan.outputs.mode == 'settings')
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    timeout-minutes: 75
    env:
      PYTHONSAFEPATH: "1"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the runner's python3 3.12 or later
        timeout-minutes: 1
        shell: bash
        env:
          JOB_RUNNER_NAME: ${{ runner.name }}
          JOB_RUNNER_OS: ${{ runner.os }}
          JOB_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          modules=(argparse base64 binascii errno hashlib http.client importlib.util json os pathlib re shutil signal socket ssl stat subprocess sys tempfile threading time typing urllib.error urllib.parse urllib.request uuid)
          python="$(command -v python3 || true)"
          found="no python3"
          if [[ -n "$python" ]]; then
            version="$("$python" -I -c 'import sys; print("Python " + sys.version.split()[0])' 2> /dev/null || echo "an unreadable python3")"
            found="$version at $python"
            if "$python" -I -c 'import sys; sys.exit(sys.version_info < (3, 12))' 2> /dev/null; then
              if missing="$("$python" -I -c 'import importlib, sys
          for name in sys.argv[1:]:
              try:
                  importlib.import_module(name)
              except Exception:
                  print(name)
                  sys.exit(1)' "${modules[@]}" 2> /dev/null)"; then
                exit 0
              fi
              found="$found, which cannot import ${missing:-its standard modules}"
            fi
          fi
          echo "::error::wac-cd: deploy needs python3 3.12 or later on the runner; found $found on $JOB_RUNNER_NAME ($JOB_RUNNER_OS, $JOB_RUNNER_ARCH)."
          exit 1
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .wacd
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wacd"
          mv .wacd "$RUNNER_TEMP/wacd"
          echo "WACD_SCRIPTS=$RUNNER_TEMP/wacd/scripts" >> "$GITHUB_ENV"
      - name: Read the published images
        id: chart
        shell: bash
        env:
          APP: ${{ needs.plan.outputs.app }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 "$WACD_SCRIPTS"/wacd-chart.py chart-images \
            --registry registry.network.svc.cluster.local:5000 \
            --app "$APP" --version "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Summarize the release
        shell: bash
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_SHA: ${{ needs.plan.outputs.expected_sha }}
        run: |
          {
            echo "### wac-cd deploy"
            echo
            echo "| mode | version | tag | expected sha |"
            echo "| --- | --- | --- | --- |"
            echo "| $MODE | $VERSION | $TAG | $EXPECTED_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release through the gateway
        shell: bash
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_SHA: ${{ needs.plan.outputs.expected_sha }}
          IMAGES: ${{ steps.chart.outputs.images }}
          WAIT_TIMEOUT: ${{ inputs.wait_timeout }}
        run: |
          python3 "$WACD_SCRIPTS"/wacd-release.py release --version "$VERSION" \
            --images "$IMAGES" --wait-timeout "$WAIT_TIMEOUT" \
            --mode "$MODE" --tag "$TAG" --expected-sha "$EXPECTED_SHA" \
            --receipt "$RUNNER_TEMP/wac-cd-release.json"
      - name: Upload the release receipt (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wac-cd-release-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/wac-cd-release.json
          if-no-files-found: error
          overwrite: true
      - name: Prove the served build
        shell: bash
        env:
          HEALTH_URL: ${{ needs.plan.outputs.health_url }}
          EXPECTED_SHA: ${{ needs.plan.outputs.expected_sha }}
          EXPECT_DB: ${{ needs.plan.outputs.health_expect_db_ok }}
        run: |
          python3 "$WACD_SCRIPTS"/wacd-release.py health --url "$HEALTH_URL" \
            --sha "$EXPECTED_SHA" --expect-db "$EXPECT_DB" --wait-timeout 300
      - name: Record the proof
        shell: bash
        run: echo "Release proved by gateway status and served sha" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [plan, deploy]
    if: >-
      !cancelled() && !failure() &&
      needs.deploy.result == 'success' && (
      needs.plan.outputs.mode == 'release' ||
      needs.plan.outputs.mode == 'resume' ||
      needs.plan.outputs.mode == 'rollback' ||
      needs.plan.outputs.mode == 'settings')
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Set up Python (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .wacd
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wacd"
          mv .wacd "$RUNNER_TEMP/wacd"
          echo "WACD_SCRIPTS=$RUNNER_TEMP/wacd/scripts" >> "$GITHUB_ENV"
      - name: Create the GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_SHA: ${{ needs.plan.outputs.expected_sha }}
        run: python3 "$WACD_SCRIPTS"/wacd-release.py github-release --tag "$TAG" --sha "$EXPECTED_SHA"
