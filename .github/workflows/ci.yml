name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: lab-actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning scripts/*.sh scripts/tests/*.sh

      - name: Validate the composite actions
        run: |
          python .github/scripts/check_actions.py
          python .github/scripts/test_workflow_identity.py
          python scripts/tests/schema-api-proxy.test.py

      - name: Run the script tests
        run: |
          bash scripts/tests/argo-await-sync.test.sh
          bash scripts/tests/helm-install.test.sh

      - uses: astral-sh/setup-uv@v5

      - name: Run the agents-md gate tests
        run: bash scripts/tests/agents-md.test.sh

  lint:
    uses: ./.github/workflows/actionlint.yml
    with:
      runner: lab-actions
    permissions:
      contents: read

  techdocs:
    uses: ./.github/workflows/techdocs.yml
    with:
      runner: lab-actions
    permissions:
      contents: read

  agents-md:
    uses: ./.github/workflows/agents-md.yml
    with:
      runner: lab-actions
    permissions:
      contents: read

  smoke:
    runs-on: lab-actions
    steps:
      - uses: actions/checkout@v4
      - uses: ./lab-tools
        with:
          tools: kubectl,kustomize,crane,kubeconform,helm
      - name: Every requested tool runs from the installed PATH
        run: |
          set -euo pipefail
          command -v kubectl kustomize crane kubeconform helm
          kubectl version --client
          kustomize version
          crane version
          kubeconform -v
          helm version
      - name: Validate real core and CRD schemas through the composite
        uses: ./lab-kubeconform
        with:
          kustomize_dir: scripts/tests/fixtures/schema-recovery
          flags: -strict -summary -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      - name: Schema transport recovery retains strict validation
        run: bash scripts/tests/validate-kustomize.test.sh
