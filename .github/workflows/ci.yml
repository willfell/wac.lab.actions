name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: lab-actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning scripts/*.sh scripts/tests/*.sh

      - name: Validate the composite actions
        run: python .github/scripts/check_actions.py

      - name: Run the script tests
        run: bash scripts/tests/argo-await-sync.test.sh

  lint:
    uses: ./.github/workflows/actionlint.yml
    with:
      runner: lab-actions
    permissions:
      contents: read

  techdocs:
    uses: ./.github/workflows/techdocs.yml
    with:
      runner: lab-actions
    permissions:
      contents: read

  smoke:
    runs-on: lab-actions
    steps:
      - uses: actions/checkout@v4
      - uses: ./lab-tools
        with:
          tools: kubectl,kustomize,crane,kubeconform,helm
      - name: Every requested tool runs from the installed PATH
        run: |
          set -euo pipefail
          command -v kubectl kustomize crane kubeconform helm
          kubectl version --client
          kustomize version
          crane version
          kubeconform -v
          helm version
