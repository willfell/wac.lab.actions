name: nextjs-site-deploy

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      app_dir:
        type: string
        default: app
      node_version:
        type: string
        default: "22"
      role_arn:
        type: string
        required: true
      aws_region:
        type: string
        required: true
      postbuild_command:
        type: string
        default: ""
      build_env:
        type: string
        default: ""
      invalidation_paths:
        type: string
        default: /*.html /index.html /_next/* /sitemap*.xml
      install_command:
        type: string
        default: yarn install
      app_cache_control:
        type: string
        default: ""
      bucket:
        type: string
        default: ""
    secrets:
      s3_bucket:
        required: false
      cloudfront_distribution_id:
        required: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ${{ inputs.runner }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.app_dir }}
    steps:
      - name: Require a bucket
        working-directory: .
        env:
          BUCKET: ${{ inputs.bucket || secrets.s3_bucket }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            echo "::error::neither the bucket input nor the s3_bucket secret was supplied" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Provide the yarn setup-node's cache probe shells out to
        run: |
          set -eu
          install=""
          command -v node >/dev/null 2>&1 || install=yes
          command -v npm >/dev/null 2>&1 || install=yes
          if [ -n "$install" ]; then
            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends nodejs npm
            else
              echo "::warning::node/npm absent and no apt-get here; setup-node's yarn cache probe will fail"
            fi
          fi
          command -v yarn >/dev/null 2>&1 || sudo npm install -g yarn
      - name: Provide the aws CLI the sync and invalidation steps shell out to
        working-directory: .
        run: |
          set -eu
          if ! command -v aws >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$tmp/awscliv2.zip"
            unzip -q "$tmp/awscliv2.zip" -d "$tmp"
            sudo "$tmp/aws/install"
            rm -rf "$tmp"
          fi
          aws --version
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: yarn
          cache-dependency-path: ${{ inputs.app_dir }}/yarn.lock
      - run: ${{ inputs.install_command }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Download cached optimized images from S3
        continue-on-error: true
        env:
          S3_BUCKET: ${{ inputs.bucket || secrets.s3_bucket }}
        run: |
          aws s3 sync "s3://${S3_BUCKET}/images" ./public/images \
            --exclude "*" \
            --include "*.webp" \
            --include "*.avif" \
            --include ".image-manifest.json" \
            --only-show-errors || echo "no cached images found"
          find ./public/images \( -name "*.webp" -o -name "*.avif" \) 2>/dev/null | wc -l
      - run: yarn images:validate
      - run: yarn images:optimize
      - name: Build
        env:
          BUILD_ENV: ${{ inputs.build_env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -n "$line" ] && export "${line?}"
          done <<<"$BUILD_ENV"
          yarn build
      - name: Postbuild
        if: inputs.postbuild_command != ''
        run: ${{ inputs.postbuild_command }}
      - name: Verify the export directory exists
        run: |
          set -euo pipefail
          if [ ! -d out ]; then
            echo "export directory 'out' not found; the build or export failed" >&2
            exit 1
          fi
          ls -la out
      - name: Sync images to S3 with immutable cache headers
        env:
          S3_BUCKET: ${{ inputs.bucket || secrets.s3_bucket }}
        run: |
          aws s3 sync out/images "s3://${S3_BUCKET}/images" \
            --cache-control "public, max-age=31536000, immutable"
      - name: Sync app files to S3
        env:
          S3_BUCKET: ${{ inputs.bucket || secrets.s3_bucket }}
          APP_CACHE_CONTROL: ${{ inputs.app_cache_control }}
        run: |
          set -euo pipefail
          args=(out "s3://${S3_BUCKET}" --exclude "images/*" --delete)
          if [ -n "$APP_CACHE_CONTROL" ]; then
            args+=(--cache-control "$APP_CACHE_CONTROL")
          fi
          aws s3 sync "${args[@]}"
      - name: Invalidate the CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ secrets.cloudfront_distribution_id }}
          INVALIDATION_PATHS: ${{ inputs.invalidation_paths }}
        run: |
          set -euo pipefail
          read -ra paths <<<"$INVALIDATION_PATHS"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "${paths[@]}"
