name: nextjs-site-deploy

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label; empty uses the caller's CI_RUNNER_SMALL variable
        type: string
        default: ''
      app_dir:
        type: string
        default: app
      node_version:
        type: string
        default: "22"
      role_arn:
        type: string
        required: true
      aws_region:
        type: string
        required: true
      postbuild_command:
        type: string
        default: ""
      build_env:
        type: string
        default: ""
      invalidation_paths:
        type: string
        default: /*.html /index.html /_next/* /sitemap*.xml
      install_command:
        type: string
        default: yarn install
      app_cache_control:
        type: string
        default: ""
      bucket:
        type: string
        default: ""
    secrets:
      s3_bucket:
        required: false
      cloudfront_distribution_id:
        required: true

permissions:
  contents: read

jobs:
  image-cache:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    env:
      PYTHONSAFEPATH: "1"
    permissions:
      contents: read
      id-token: write
    outputs:
      cached: ${{ steps.cache.outputs.cached }}
    steps:
      - name: Require a bucket
        env:
          BUCKET: ${{ inputs.bucket || secrets.s3_bucket }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            echo "::error::neither the bucket input nor the s3_bucket secret was supplied" >&2
            exit 1
          fi
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .lab-actions
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/lab-actions"
          mv .lab-actions "$RUNNER_TEMP/lab-actions"
          echo "LAB_ACTIONS_SCRIPTS=$RUNNER_TEMP/lab-actions/scripts" >> "$GITHUB_ENV"
      - name: Provide the aws CLI
        run: bash "$LAB_ACTIONS_SCRIPTS/install-awscli.sh"
      - name: Configure AWS credentials (aws-actions/configure-aws-credentials v6.3.0)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Download cached optimized images from S3
        continue-on-error: true
        env:
          S3_BUCKET: ${{ inputs.bucket || secrets.s3_bucket }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-cache"
          aws s3 sync "s3://${S3_BUCKET}/images" "$RUNNER_TEMP/image-cache" \
            --exclude "*" \
            --include "*.webp" \
            --include "*.avif" \
            --include ".image-manifest.json" \
            --only-show-errors || echo "no cached images found"
      - name: Count the cached images
        id: cache
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/image-cache"
          mkdir -p "$cache"
          find "$cache" \( -name "*.webp" -o -name "*.avif" \) | wc -l
          if [ -n "$(find "$cache" -type f -print -quit)" ]; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand the cache to the build (actions/upload-artifact v7.0.2)
        if: steps.cache.outputs.cached == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nextjs-image-cache
          path: ${{ runner.temp }}/image-cache
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  build:
    needs: image-cache
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.app_dir }}
    steps:
      - name: Check out the repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provide the yarn setup-node's cache probe shells out to
        run: |
          set -eu
          install=""
          command -v node >/dev/null 2>&1 || install=yes
          command -v npm >/dev/null 2>&1 || install=yes
          if [ -n "$install" ]; then
            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends nodejs npm
            else
              echo "::warning::node/npm absent and no apt-get here; setup-node's yarn cache probe will fail"
            fi
          fi
          command -v yarn >/dev/null 2>&1 || sudo npm install -g yarn
      - name: Set up Node (actions/setup-node v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node_version }}
          cache: yarn
          cache-dependency-path: ${{ inputs.app_dir }}/yarn.lock
      - run: ${{ inputs.install_command }}
      - name: Restore the cached optimized images (actions/download-artifact v8.0.2)
        if: needs.image-cache.outputs.cached == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nextjs-image-cache
          path: ${{ inputs.app_dir }}/public/images
      - name: Count the restored images
        run: find ./public/images \( -name "*.webp" -o -name "*.avif" \) 2>/dev/null | wc -l
      - run: yarn images:validate
      - run: yarn images:optimize
      - name: Build
        env:
          BUILD_ENV: ${{ inputs.build_env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -n "$line" ] && export "${line?}"
          done <<<"$BUILD_ENV"
          yarn build
      - name: Postbuild
        if: inputs.postbuild_command != ''
        run: ${{ inputs.postbuild_command }}
      - name: Verify the export directory exists
        run: |
          set -euo pipefail
          if [ ! -d out ]; then
            echo "export directory 'out' not found; the build or export failed" >&2
            exit 1
          fi
          ls -la out
      - name: Hand the export to the deploy (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nextjs-site-out
          path: ${{ inputs.app_dir }}/out
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_SMALL }}
    env:
      PYTHONSAFEPATH: "1"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the defining workflow commit
        env:
          SHARED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: '[[ "$SHARED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the shared scripts (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: willfell/wac.lab.actions
          ref: ${{ job.workflow_sha }}
          path: .lab-actions
          persist-credentials: false
      - name: Move the shared checkout out of the workspace
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/lab-actions"
          mv .lab-actions "$RUNNER_TEMP/lab-actions"
          echo "LAB_ACTIONS_SCRIPTS=$RUNNER_TEMP/lab-actions/scripts" >> "$GITHUB_ENV"
      - name: Download the site export (actions/download-artifact v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nextjs-site-out
          path: ${{ runner.temp }}/site-out
      - name: Refuse anything in the export but plain files and directories
        env:
          SITE_OUT: ${{ runner.temp }}/site-out
        run: bash "$LAB_ACTIONS_SCRIPTS/check-site-export.sh" "$SITE_OUT"
      - name: Provide the aws CLI
        run: bash "$LAB_ACTIONS_SCRIPTS/install-awscli.sh"
      - name: Configure AWS credentials (aws-actions/configure-aws-credentials v6.3.0)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Sync images to S3 with immutable cache headers
        env:
          S3_BUCKET: ${{ inputs.bucket || secrets.s3_bucket }}
          SITE_OUT: ${{ runner.temp }}/site-out
        run: |
          set -euo pipefail
          if [ ! -d "$SITE_OUT/images" ]; then
            echo "the export has no images directory, so there are no images to sync"
            exit 0
          fi
          aws s3 sync "$SITE_OUT/images" "s3://${S3_BUCKET}/images" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-follow-symlinks
      - name: Sync app files to S3
        env:
          S3_BUCKET: ${{ inputs.bucket || secrets.s3_bucket }}
          APP_CACHE_CONTROL: ${{ inputs.app_cache_control }}
          SITE_OUT: ${{ runner.temp }}/site-out
        run: |
          set -euo pipefail
          args=("$SITE_OUT" "s3://${S3_BUCKET}" --exclude "images/*" --delete --no-follow-symlinks)
          if [ -n "$APP_CACHE_CONTROL" ]; then
            args+=(--cache-control "$APP_CACHE_CONTROL")
          fi
          aws s3 sync "${args[@]}"
      - name: Invalidate the CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ secrets.cloudfront_distribution_id }}
          INVALIDATION_PATHS: ${{ inputs.invalidation_paths }}
        run: |
          set -euo pipefail
          read -ra paths <<<"$INVALIDATION_PATHS"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "${paths[@]}"
