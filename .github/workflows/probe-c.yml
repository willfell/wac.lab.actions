name: probe-c

on:
  pull_request:
    paths:
      - .github/workflows/probe-c.yml

permissions:
  contents: read

jobs:
  gate-fails:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - run: exit 1

  needs-failed-plain:
    needs: gate-fails
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - run: echo ran

  needs-failed-always:
    needs: gate-fails
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - env:
          GATE: ${{ needs.gate-fails.result }}
        run: |
          echo "gate result: $GATE"
          test "$GATE" = success

  gate-passes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - run: "true"

  needs-passed-always:
    needs: gate-passes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - env:
          GATE: ${{ needs.gate-passes.result }}
        run: |
          echo "gate result: $GATE"
          test "$GATE" = success

  tag-push:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push one probe tag per commit kind, then delete each that landed
        env:
          MAIN_SHA: f1fdb7383f1d8c51d89a2fa82db8c1f60ff2e4f8
          OLD_SHA: ad724c87f576c1593731cd3d05e034e915d9804b
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.run_id }}
        run: |
          git fetch -q origin main
          for kind in MAIN OLD HEAD; do
            var="${kind}_SHA"; sha="${!var}"
            same=no
            if git diff --quiet "origin/main" "$sha" -- .github/workflows; then same=yes; fi
            name="probe-c-${RUN}-${kind,,}"
            if out=$(git push origin "${sha}:refs/tags/${name}" 2>&1); then
              echo "RESULT ${kind} sha=${sha} workflows_same_as_main=${same}: pushed"
              git push -q origin ":refs/tags/${name}" && echo "  deleted ${name}"
            else
              echo "RESULT ${kind} sha=${sha} workflows_same_as_main=${same}: refused"
              echo "$out" | grep -E 'remote:|rejected|refusing|error' | sed 's/^/  /'
            fi
          done
