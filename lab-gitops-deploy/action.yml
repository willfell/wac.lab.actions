name: lab-gitops-deploy
description: Build an image, push it to the in-cluster registry, pin it via a kustomize commit back to main over the deploy key, force an Argo sync, and verify the served build is the source sha
inputs:
  image:
    description: Image name, also the default deployment name (e.g. finance-app)
    required: true
  extra_images:
    description: Space-separated additional image names pinned to the same sha in the same deploy commit (e.g. wealth-garmin); empty disables
    default: ""
  argo_app:
    description: Argo CD Application to sync and wait on
    required: true
  namespace:
    description: Namespace holding the deployment
    required: true
  deploy_ssh_key:
    description: Write-scoped deploy key authorizing the kustomize commit-back push
    required: true
  deployment:
    description: Deployment name when it differs from the image name
    default: ""
  dockerfile:
    description: Dockerfile path
    default: deploy/Dockerfile
  build_context:
    description: Docker build context
    default: ./
  sha_build_arg:
    description: Build-arg name that receives the source sha (e.g. FINANCE_BUILD_SHA); empty disables
    default: ""
  build_secret:
    description: Value exposed to the build as the node_auth_token docker secret; empty disables
    default: ""
  kustomize_dir:
    description: Directory holding the kustomization the pin edits
    default: deploy/k8s
  push_registry:
    description: In-cluster registry address runners push to
    default: registry.network.svc.cluster.local:5000
  pull_registry:
    description: Registry address the node's docker daemon pulls from
    default: localhost:30500
  health_url:
    description: In-cluster health endpoint returning {sha,...}; empty skips verification
    default: ""
  health_expect_db_ok:
    description: Also assert the health payload reports db == ok
    default: "true"
  wait_timeout:
    description: Seconds to wait on each Argo condition
    default: "300"
  require_hook:
    description: Retired since v1.10.9; accepted for compatibility and ignored, because migration proof is the app's schema-aware health route
    default: ""
  kubectl_version:
    description: kubectl release for the deploy steps
    default: v1.35.0
  kustomize_version:
    description: kustomize release for the pin step
    default: v5.7.1
  crane_version:
    description: go-containerregistry release for the registry push
    default: v0.20.6
outputs:
  bump_sha:
    description: The main-branch commit carrying the image pin
    value: ${{ steps.pin.outputs.bump_sha }}
runs:
  using: composite
  steps:
    - name: Install kubectl, kustomize, and crane
      shell: bash
      env:
        KUBECTL_VERSION: ${{ inputs.kubectl_version }}
        KUSTOMIZE_VERSION: ${{ inputs.kustomize_version }}
        CRANE_VERSION: ${{ inputs.crane_version }}
      run: |
        "${{ github.action_path }}/../scripts/install-tools.sh" kubectl,kustomize,crane
    - name: Build the image
      shell: bash
      env:
        DOCKER_BUILDKIT: "1"
        NODE_AUTH_TOKEN: ${{ inputs.build_secret }}
        IMAGE: ${{ inputs.image }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUILD_CONTEXT: ${{ inputs.build_context }}
        SHA_BUILD_ARG: ${{ inputs.sha_build_arg }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "$SHA_BUILD_ARG" ]; then
          args+=(--build-arg "${SHA_BUILD_ARG}=${GITHUB_SHA}")
        fi
        if [ -n "$NODE_AUTH_TOKEN" ]; then
          args+=(--secret "id=node_auth_token,env=NODE_AUTH_TOKEN")
        fi
        docker build -f "$DOCKERFILE" "${args[@]}" -t "$IMAGE:$GITHUB_SHA" "$BUILD_CONTEXT"
    - name: Push to the in-cluster registry
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PUSH_REGISTRY: ${{ inputs.push_registry }}
      run: |
        set -euo pipefail
        docker save "$IMAGE:$GITHUB_SHA" -o "$RUNNER_TEMP/image.tar"
        crane push --insecure "$RUNNER_TEMP/image.tar" "$PUSH_REGISTRY/$IMAGE:$GITHUB_SHA"
    - name: Authorize the deploy key for the commit-back push
      shell: bash
      env:
        DEPLOY_SSH_KEY: ${{ inputs.deploy_ssh_key }}
      run: |
        set -euo pipefail
        if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
          echo "deploy_ssh_key input is empty; the commit-back push would be rejected" >&2
          exit 1
        fi
        if ! command -v ssh >/dev/null; then
          echo "openssh-client is missing on this runner image; cannot push with a deploy key" >&2
          exit 1
        fi
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
        echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
    - name: Pin the image and commit it back
      id: pin
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        EXTRA_IMAGES: ${{ inputs.extra_images }}
        PULL_REGISTRY: ${{ inputs.pull_registry }}
        KUSTOMIZE_DIR: ${{ inputs.kustomize_dir }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        pinned=""
        for _ in 1 2 3 4 5; do
          git fetch origin main
          git checkout -B ci-pin origin/main
          (cd "$KUSTOMIZE_DIR" && kustomize edit set image "$IMAGE=$PULL_REGISTRY/$IMAGE:$GITHUB_SHA")
          for extra in $EXTRA_IMAGES; do
            (cd "$KUSTOMIZE_DIR" && kustomize edit set image "$extra=$PULL_REGISTRY/$extra:$GITHUB_SHA")
          done
          git add "$KUSTOMIZE_DIR/kustomization.yaml"
          if git diff --cached --quiet; then
            pinned=$(git rev-parse HEAD)
            echo "image already pinned to $GITHUB_SHA at $pinned"
            break
          fi
          git commit -m "deploy: $GITHUB_SHA [skip ci]"
          if git push origin HEAD:main; then
            pinned=$(git rev-parse HEAD)
            break
          fi
          sleep 5
        done
        if [ -z "$pinned" ]; then
          echo "could not push the deploy commit to main"
          exit 1
        fi
        echo "bump_sha=$pinned" >> "$GITHUB_OUTPUT"
    - name: Check whether the application is onboarded to Argo
      id: onboarded
      shell: bash
      env:
        ARGO_APP: ${{ inputs.argo_app }}
      run: |
        set -euo pipefail
        if kubectl -n argocd get application "$ARGO_APP" >/dev/null 2>&1; then
          echo "onboarded=true" >> "$GITHUB_OUTPUT"
        else
          echo "application not onboarded yet, stopping after image push"
          echo "onboarded=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Request a sync of the pinned revision and wait until Synced at it
      if: steps.onboarded.outputs.onboarded == 'true'
      shell: bash
      env:
        ARGO_APP: ${{ inputs.argo_app }}
        BUMP_SHA: ${{ steps.pin.outputs.bump_sha }}
        WAIT_TIMEOUT: ${{ inputs.wait_timeout }}
        REQUIRE_HOOK: ${{ inputs.require_hook }}
      run: |
        "${{ github.action_path }}/../scripts/argo-await-sync.sh"
    - name: Wait for Argo to reach that revision, synced and healthy
      if: steps.onboarded.outputs.onboarded == 'true'
      shell: bash
      env:
        ARGO_APP: ${{ inputs.argo_app }}
        BUMP_SHA: ${{ steps.pin.outputs.bump_sha }}
        WAIT_TIMEOUT: ${{ inputs.wait_timeout }}
      run: |
        set -euo pipefail
        kubectl -n argocd wait "application/$ARGO_APP" --timeout="${WAIT_TIMEOUT}s" \
          --for=jsonpath='{.status.sync.revision}'="$BUMP_SHA"
        kubectl -n argocd wait "application/$ARGO_APP" --timeout="${WAIT_TIMEOUT}s" \
          --for=jsonpath='{.status.sync.status}'=Synced
        kubectl -n argocd wait "application/$ARGO_APP" --timeout="${WAIT_TIMEOUT}s" \
          --for=jsonpath='{.status.health.status}'=Healthy
    - name: Wait for the rollout
      if: steps.onboarded.outputs.onboarded == 'true'
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        IMAGE: ${{ inputs.image }}
        DEPLOYMENT_NAME: ${{ inputs.deployment }}
      run: |
        set -euo pipefail
        kubectl -n "$NAMESPACE" rollout status "deploy/${DEPLOYMENT_NAME:-$IMAGE}" --timeout=5m
    - name: Set up node for the verify step
      if: steps.onboarded.outputs.onboarded == 'true' && inputs.health_url != ''
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Verify the running build is the one just built
      if: steps.onboarded.outputs.onboarded == 'true' && inputs.health_url != ''
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health_url }}
        WANT_SHA: ${{ github.sha }}
        EXPECT_DB: ${{ inputs.health_expect_db_ok }}
      run: |
        node -e '
          const url = process.env.HEALTH_URL;
          const want = process.env.WANT_SHA;
          const expectDb = process.env.EXPECT_DB === "true";
          fetch(url)
            .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
            .then((j) => {
              if (j.sha !== want) {
                throw new Error("serving " + j.sha + ", expected " + want);
              }
              if (expectDb && j.db !== "ok") {
                throw new Error("database unhealthy: " + j.db);
              }
              console.log("verified: " + url + " is serving " + j.sha);
            })
            .catch((e) => {
              console.error(e.message);
              process.exit(1);
            });
        '
